[package]
name = "installer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
sha1 = "0.10"
sha2 = "0.11.0"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
